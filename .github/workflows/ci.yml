name: Check and Test

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: install-unix
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: install-windows
        if: ${{ matrix.os == 'windows-latest' }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: post install
        run: |
          moon version --all
          moon update

      - name: moon check
        run: moon check --target all --deny-warn

      - name: moon build
        run: moon build --target all

      - name: moon test (all backends)
        run: moon test --target all

      - name: lint (fmt is clean)
        run: |
          moon fmt && git diff --exit-code

  # Real third-party gRPC interop: a genuine `grpcurl` client (Go, unrelated codebase)
  # discovers the moonrpc server via Server Reflection and calls it. This proves the
  # self-built HTTP/2 + HPACK + gRPC framing + trailers + descriptor bytes actually
  # interoperate with a foreign, unforgiving client — not just moonrpc talking to
  # itself. A transport regression makes the grep assertions fail.
  grpcurl-interop:
    name: real gRPC interop (grpcurl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - name: install grpcurl
        run: go install github.com/fullstorydev/grpcurl/cmd/grpcurl@latest

      - name: grpcurl list / describe / call against the moonrpc server
        run: |
          set -euo pipefail
          export PATH="$PATH:$(go env GOPATH)/bin"
          # `moon run` builds and launches the native greeter; run it in the
          # background and let the job teardown reap it.
          moon run cmd/greetd --target native -- 50051 &
          SRV=$!
          trap 'kill $SRV 2>/dev/null || true' EXIT
          sleep 6
          echo "== list (Server Reflection) =="
          grpcurl -plaintext -max-time 10 127.0.0.1:50051 list | tee /tmp/list.txt
          grep -q '^greet.Greeter$' /tmp/list.txt
          echo "== describe =="
          grpcurl -plaintext -max-time 10 127.0.0.1:50051 describe greet.Greeter | tee /tmp/desc.txt
          grep -q 'rpc SayHello' /tmp/desc.txt
          echo "== unary call =="
          grpcurl -plaintext -max-time 10 -d '{"name":"world"}' 127.0.0.1:50051 greet.Greeter/SayHello | tee /tmp/call.txt
          grep -q 'Hello, world' /tmp/call.txt
          echo "grpcurl interop OK"
